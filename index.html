<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<link rel="stylesheet" href="/src/style.css">
<title>Kurvenjäger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">


<div id="app">
  <canvas id="c"></canvas>
  <canvas id="o"></canvas>
  <div id="flash"></div>
  <div id="hud" hidden>
    <div>
      <div class="pos"><b id="posTxt">4</b><span>/ 4</span></div>
      <div class="lap" id="lapTxt">Runde 1 / 3</div>
    </div>
    <div class="clock"><small>Zeit</small><b id="timeTxt">0:00.00</b></div>
  </div>
  <div id="wrong" hidden>Falsche Richtung!</div>
  <div id="speed" hidden><b id="spdTxt">0</b><small>km/h</small></div>
  <div id="banner"><b></b><span></span></div>
  <div id="ctl" hidden>
    <div>
      <button class="pad steer" id="bL" type="button" aria-label="Nach links lenken"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <button class="pad steer" id="bR" type="button" aria-label="Nach rechts lenken"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <div>
      <button class="pad drift" id="bDrift" type="button" aria-label="Driften und bremsen">DRIFT</button>
      <button class="pad" id="bItem" type="button" aria-label="Item benutzen"><span>ITEM</span></button>
    </div>
  </div>

  <button id="mute" class="mute" type="button" aria-pressed="true">Ton an</button>
  <div id="menu" class="overlay">
    <div class="mscroll"><div class="menuIn" id="menuIn">
      <header class="mhead"><p class="kicker" id="mKicker">Himmels-Rennen</p><h1>Kurven<em>jäger</em></h1></header>
      <div id="page"></div>
    </div></div>
    <nav id="nav" aria-label="Menü-Navigation">
      <button id="navBack" class="ghost" type="button">Zurück</button>
      <span id="navStep" class="navStep"></span>
      <button id="navNext" class="cta" type="button">Weiter</button>
    </nav>
  </div>

  <div id="over" class="overlay dim" hidden>
    <div class="menuIn">
      <p class="kicker" id="overKick">Zieleinlauf</p>
      <h1 id="overTitle">Platz 1</h1>
      <p class="newbest" id="newBest" hidden>Neue Bestzeit!</p>
      <ol id="results"></ol>
      <div class="res">
        <div><small>Deine Zeit</small><b id="rTime">0:00.00</b></div>
        <div><small>Beste Runde</small><b id="rLap">0:00.00</b></div>
      </div>
      <button id="rwBtn" class="cta" type="button">Belohnungen ansehen</button>
    </div>
  </div>

  <div id="reward" class="overlay dim" hidden>
    <div class="menuIn">
      <p class="kicker">Belohnungen</p>
      <h1 id="rwTitle">+0 Punkte</h1>
      <ul id="rwLines"></ul>
      <div class="rwTotal"><span>Punkte erhalten</span><b id="rwTotal">0</b></div>
      <div id="rwStats" class="hint"></div>
      <div id="rwUnlocks" hidden>
        <h2 class="sec">Neu freigeschaltet</h2>
        <div id="rwChips"></div>
      </div>
      <div id="rwGoal" class="goal" hidden></div>
      <div class="row">
        <button id="againBtn" class="cta" type="button">Nochmal</button>
        <button id="changeBtn" class="ghost" type="button">Zum Menü</button>
      </div>
    </div>
  </div>

  <div id="unlock" class="overlay unl" hidden>
    <div class="unStage" id="unStage"></div>
    <div class="rays" aria-hidden="true"></div>
    <div id="confetti" aria-hidden="true"></div>
    <div class="unTop"><p class="kicker" id="unKind">Neu freigeschaltet</p><h1 id="unName">Name</h1><p class="unSub" id="unSub"></p></div>
    <div class="unBot"><span id="unCount"></span><button id="unNext" class="cta" type="button">Weiter</button></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>

</body></html>
